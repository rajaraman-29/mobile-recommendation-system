<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Recommended Mobiles</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<button class="dark-toggle" onclick="toggleDarkMode()">🌙</button>

<div class="page-title">
    <h1>Recommended Devices</h1>
    <p>Carefully matched to your preferences.</p>
</div>

<form action="/compare" method="post">

<div class="results-container">

{% for mobile in mobiles %}
<div class="mobile-card">

    <img src="{{ mobile.image }}" alt="{{ mobile.model }}"
         onerror="this.src='/static/fallback.png'">

    <h3 class="phone-title">{{ mobile.model }}</h3>

    <p class="price">₹{{ mobile.price }}</p>

    <p class="specs">
        {{ mobile.ram }}GB RAM • {{ mobile.storage }}GB
    </p>

    <div class="rating">
        ★ {{ mobile.rating }}
    </div>

    <a href="{{ mobile.amazon_link }}" target="_blank" class="store-btn">
        Buy
    </a>

    <br><br>

    <label>
        <input type="checkbox" name="compare" value="{{ mobile.model }}">
        Compare
    </label>

</div>
{% endfor %}

</div>

<div class="compare-sticky">
    <button type="submit" class="compare-btn">Compare Selected</button>
</div>

</form>

<div class="back-container">
    <a href="/" class="back-button">← Back to Home</a>
</div>

<script>
function toggleDarkMode() {
    document.body.classList.toggle("dark");
    localStorage.setItem("darkMode", document.body.classList.contains("dark"));
}
if (localStorage.getItem("darkMode") === "true") {
    document.body.classList.add("dark");
}
</script>

</body>
</html>
